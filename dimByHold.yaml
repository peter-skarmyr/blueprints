  blueprint:
    name: Dim by hold
    domain: automation  
    input:
      switch:
        name: Light switch
        selector:
          device:
            filter:
              - integration: zha
                manufacturer: IKEA of Sweden
                model: RODRET Dimmer
              - integration: zha
                manufacturer: Signify Netherlands B.V.
                model: RWL022
      target_lights:
        name: Target light entity
        selector:
          entity:
            filter:
              domain: light
  triggers:
    - device_id: !input switch
      domain: zha
      type: remote_button_long_press  
      subtype: dim_up
      trigger: device
      id: dimUpStart
    - device_id: !input switch
      domain: zha
      type: remote_button_long_release
      subtype: dim_up
      trigger: device
      id: dimUpStop
    - device_id: !input switch
      domain: zha
      type: remote_button_long_press
      subtype: dim_down
      trigger: device
      id: dimDownStart
    - device_id: !input switch
      domain: zha
      type: remote_button_long_release
      subtype: dim_down
      trigger: device
      id: dimDownStop
  conditions: []
  variables: 
    dimStepPercentageHold: 25
    iterationTimeInSeconds: 1.1
    target_lights: !input target_lights
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - dimDownStop
                - dimUpStop
          sequence:
            - stop: Stop dimming
              error: false
        - conditions:
            - condition: trigger
              id:
                - dimDownStart
          sequence:
            - repeat:
                count: 5
                sequence:
                  - choose:
                      - conditions:
                          - condition: numeric_state
                            entity_id: !input target_lights
                            attribute: brightness
                            below: 2
                        sequence:
                          - stop: Minimum brightness
                            error: false
                    default:
                      - action: light.turn_on
                        metadata: {}
                        data:
                          # Compute the next brightness explicitly and floor it at 1 so we
                          # never send brightness: 0, which Home Assistant silently turns
                          # into light.turn_off with no visible action in the trace.
                          brightness: >-
                            {{ [1, ((state_attr(target_lights, 'brightness') | int(1)) - (255 * dimStepPercentageHold / 100)) | round(0, 'floor') | int] | max }}
                          transition: "{{ iterationTimeInSeconds }}"
                        target:
                          entity_id: !input target_lights
                      - delay:
                          hours: 0
                          minutes: 0
                          seconds: "{{ iterationTimeInSeconds }}"
        - conditions:
            - condition: trigger
              id:
                - dimUpStart
          sequence:
            - repeat:
                count: 5
                sequence:
                  - choose:
                      - conditions:
                          - condition: numeric_state
                            entity_id: !input target_lights
                            attribute: brightness
                            above: 254
                        sequence:
                          - stop: At maximum brightness
                            error: false
                    default:
                      - action: light.turn_on
                        metadata: {}
                        data:
                          brightness_step_pct: "{{ dimStepPercentageHold }}"
                          transition: "{{ iterationTimeInSeconds }}"
                        target:
                          entity_id: !input target_lights
                      - delay:
                          seconds: "{{ iterationTimeInSeconds }}"
  mode: restart
